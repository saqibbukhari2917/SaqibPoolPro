name: Build Saqib Finance APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: saqib-finance-debug-keystore-v1
      - name: Create debug signing key if missing
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.config/.android/debug.keystore" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Save stable debug SHA-1 for Firebase
        run: |
          gradle --no-daemon :app:signingReport | tee signing-report.txt
          SHA1=$(awk '/Variant: debug/{debug=1} debug && /SHA1:/{print $2; exit}' signing-report.txt)
          test -n "$SHA1"
          echo "$SHA1" > firebase-debug-sha1.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-debug-sha1.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record stable Firebase debug SHA-1"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Saqib-Finance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
